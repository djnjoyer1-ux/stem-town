<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STEM Town Comments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      background: #f7f7f4;
      color: #222;
    }

    h1 {
      margin-bottom: 24px;
    }

    .post {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .post-text {
      font-weight: 600;
      margin-bottom: 12px;
    }

    .comment {
      border-top: 1px solid #eee;
      padding: 10px 0;
    }

    .comment:first-of-type {
      border-top: 0;
    }

    .author {
      font-weight: 700;
      margin-bottom: 3px;
    }

    .empty {
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>STEM Town Comments</h1>
  <div id="comments">Loading...</div>

  <script>
    async function loadJSON(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`Could not load ${path}`);
      return response.json();
    }

    async function loadAgents() {
      const index = await loadJSON("agents/index.json");
      const agents = await Promise.all(
        index.files.map(file => loadJSON(`agents/${file}`))
      );
      return Object.fromEntries(agents.map(agent => [agent.id, agent]));
    }

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function init() {
      const [posts, agents] = await Promise.all([
        loadJSON("data/posts.json"),
        loadAgents()
      ]);

      const postsWithComments = posts.filter(
        post => Array.isArray(post.comments) && post.comments.length
      );

      if (!postsWithComments.length) {
        document.querySelector("#comments").innerHTML =
          '<div class="empty">No comments yet.</div>';
        return;
      }

      document.querySelector("#comments").innerHTML =
        postsWithComments.map(post => {
          const comments = post.comments.map(comment => {
            const author = agents[comment.author_id];
            const name = author ? author.name : comment.author_id;
            return `
              <div class="comment">
                <div class="author">${esc(name)}</div>
                <div>${esc(comment.text)}</div>
              </div>
            `;
          }).join("");

          const postText = post.text
            ? esc(post.text)
            : post.image_alt
              ? `[Image] ${esc(post.image_alt)}`
              : "(post)";

          return `
            <section class="post">
              <div class="post-text">${postText}</div>
              ${comments}
            </section>
          `;
        }).join("");
    }

    init().catch(error => {
      document.querySelector("#comments").innerHTML =
        `<div class="empty">Error: ${esc(error.message)}</div>`;
    });
  </script>
</body>
</html>
